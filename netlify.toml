[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "VITE_APP_NAME,VITE_APP_URL,VITE_GOOGLE_API_KEY,VITE_GOOGLE_CLIENT_ID,VITE_GOOGLE_CLIENT_SECRET"

[[redirects]]
  from = "/api/google-oauth/token"
  to = "/.netlify/functions/google-oauth"
  status = 200
  force = true

[[redirects]]
  from = "/api/resolve-media"
  to = "/.netlify/functions/resolve-media"
  status = 200
  force = true

[[redirects]]
  from = "/api/stream/video"
  to = "/.netlify/functions/stream-video"
  status = 200
  force = true

[[redirects]]
  from = "/api/stream/pdf"
  to = "/.netlify/functions/stream-pdf"
  status = 200
  force = true

[[redirects]]
  from = "/api/pw/*"
  to = "/.netlify/functions/pw-proxy/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/nts"
  to = "https://nt.studyace.in/api/nig"
  status = 200
  force = true

[[redirects]]
  from = "/api/nts/*"
  to = "https://nt.studyace.in/api/nig/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/vc/*"
  to = "https://nt.studyace.in/vc/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/studybee/batches.json"
  to = "/batches.json"
  status = 200
  force = true

[[redirects]]
  from = "/api/studybee/*"
  to = "/batches.json"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
