[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/resolve-media"
  to = "/.netlify/functions/resolve-media"
  status = 200
  force = true

[[redirects]]
  from = "/api/stream/video"
  to = "/.netlify/functions/stream-video"
  status = 200
  force = true

[[redirects]]
  from = "/api/stream/pdf"
  to = "/.netlify/functions/stream-pdf"
  status = 200
  force = true

[[redirects]]
  from = "/api/pw/*"
  to = "/.netlify/functions/pw-proxy/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/nts/*"
  to = "https://nts.khatikgaurav38.workers.dev/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/studybee/*"
  to = "https://nt.studybeepro.site/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
